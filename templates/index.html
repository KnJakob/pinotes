<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notizen</title>
<style>
/* ═══════════════════════════════════════════════
   FARB-VARIABLEN – hier alles anpassen
   ═══════════════════════════════════════════════ */
:root {
  --bg-app:          #1c1c1e;   /* App-Hintergrund        */
  --bg-panel:        #2c2c2e;   /* Seiten-Panel            */
  --bg-card:         #3a3a3c;   /* Notiz-Karten            */
  --bg-card-active:  #48484a;   /* Aktive Karte            */
  --bg-editor:       #1c1c1e;   /* Editor-Hintergrund      */
  --bg-toolbar:      #2c2c2e;   /* Toolbar                 */
  --bg-overlay:      rgba(0,0,0,0.55);

  --accent:          #ffd60a;   /* Akzentfarbe (gelb)      */
  --accent-dim:      rgba(255, 214, 10, 0.15);

  --text-primary:    #f2f2f7;   /* Haupttext               */
  --text-secondary:  #aeaeb2;   /* Sekundärtext            */
  --text-placeholder:#636366;   /* Placeholder             */
  --text-editor:     #f2f2f7;   /* Editor-Text             */

  --border:          rgba(255,255,255,0.08);
  --border-strong:   rgba(255,255,255,0.15);

  --radius-sm:       8px;
  --radius-md:       12px;
  --radius-lg:       16px;

  --font-ui:         'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif;
  --font-editor:     'SF Pro Text', -apple-system, 'Helvetica Neue', sans-serif;

  --panel-width:     320px;
  --toolbar-height:  52px;
  --save-delay:      800;        /* ms bis auto-save        */
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button {
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

/* ═══════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════ */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
}

/* ═══════════════════════════════════════════════
   TOOLBAR
   ═══════════════════════════════════════════════ */
#toolbar {
  flex-shrink: 0;
  height: var(--toolbar-height);
  background: var(--bg-toolbar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  position: relative;
  z-index: 10;
  user-select: none;
}

#toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

#toolbar-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

#toolbar-right {
  display: flex;
  align-items: center;
  gap: 4px;
}

.toolbar-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}
.toolbar-btn:active { background: var(--bg-card); }
.toolbar-btn.active, .toolbar-btn:hover { color: var(--accent); }

#note-title-display {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#folder-badge {
  font-size: 10px;
  color: var(--text-secondary);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#save-indicator {
  font-size: 11px;
  color: var(--text-placeholder);
  transition: opacity 0.4s;
  opacity: 0;
  white-space: nowrap;
}
#save-indicator.visible { opacity: 1; }

/* Format-Buttons in Toolbar */
.fmt-btn {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: background 0.15s, color 0.15s;
}
.fmt-btn:active { background: var(--bg-card); }
.fmt-btn.active { color: var(--accent); background: var(--accent-dim); }

/* ═══════════════════════════════════════════════
   EDITOR AREA
   ═══════════════════════════════════════════════ */
#editor-area {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg-editor);
}

#note-title-input {
  flex-shrink: 0;
  padding: 20px 20px 0 20px;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-ui);
  resize: none;
  overflow: hidden;
  min-height: 0;
  line-height: 1.3;
}
#note-title-input::placeholder { color: var(--text-placeholder); }

#note-date-line {
  flex-shrink: 0;
  padding: 4px 20px 8px 20px;
  font-size: 12px;
  color: var(--text-placeholder);
  border-bottom: 1px solid var(--border);
}

#editor {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 80px 20px;
  font-size: 16px;
  line-height: 1.65;
  color: var(--text-editor);
  font-family: var(--font-editor);
  outline: none;
  -webkit-overflow-scrolling: touch;
}

#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--text-placeholder);
  pointer-events: none;
}

/* Editor content styles */
#editor ul, #editor ol {
  padding-left: 24px;
  margin: 6px 0;
}
#editor li { margin: 2px 0; }
#editor b, #editor strong { font-weight: 700; }
#editor i, #editor em { font-style: italic; }
#editor u { text-decoration: underline; }

/* ═══════════════════════════════════════════════
   SIDE PANEL (Ordner + Notizen)
   ═══════════════════════════════════════════════ */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  z-index: 20;
  opacity: 0;
  transition: opacity 0.25s;
}
#overlay.visible { opacity: 1; }

#side-panel {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--panel-width);
  max-width: 88vw;
  background: var(--bg-panel);
  z-index: 30;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 24px rgba(0,0,0,0.4);
}
#side-panel.open { transform: translateX(0); }

#panel-header {
  padding: 16px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#panel-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

#panel-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--text-secondary);
  transition: background 0.15s;
}
#panel-close:active { background: var(--bg-card); }

/* Panel views */
#panel-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── Folder list ── */
.folder-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.folder-item:active, .folder-item.active { background: var(--bg-card-active); }

.folder-icon { font-size: 20px; flex-shrink: 0; }
.folder-info { flex: 1; min-width: 0; }
.folder-name { font-size: 15px; font-weight: 500; }
.folder-count { font-size: 12px; color: var(--text-secondary); }
.folder-chevron { color: var(--text-placeholder); font-size: 12px; }

.folder-item.active .folder-name { color: var(--accent); }

/* ── Note list ── */
#notes-view { display: none; }
#notes-view.visible { display: block; }
#folders-view { display: block; }
#folders-view.hidden { display: none; }

#notes-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#notes-back {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  color: var(--accent);
  font-weight: 500;
}

#notes-folder-title {
  flex: 1;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

#new-note-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #000;
  font-weight: 300;
  transition: transform 0.15s;
}
#new-note-btn:active { transform: scale(0.92); }

.note-card {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.note-card:active, .note-card.active { background: var(--bg-card-active); }
.note-card.active .note-card-title { color: var(--accent); }

.note-card-title {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-card-preview {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 3px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.note-card-date {
  font-size: 11px;
  color: var(--text-placeholder);
  margin-top: 4px;
}

/* ── Add folder row ── */
#add-folder-row {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--accent);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border-top: 1px solid var(--border);
}
#add-folder-row:active { background: var(--bg-card); }

/* ═══════════════════════════════════════════════
   MODAL (Folder erstellen / Aktionen)
   ═══════════════════════════════════════════════ */
#modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  z-index: 50;
  align-items: flex-end;
}
#modal-backdrop.visible {
  display: flex;
}

#modal-sheet {
  width: 100%;
  background: var(--bg-panel);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 20px 20px 40px;
  animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  text-align: center;
}

.modal-input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 16px;
  color: var(--text-primary);
  font-family: var(--font-ui);
  outline: none;
}
.modal-input:focus { border-color: var(--accent); }

.modal-btn-row {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  transition: opacity 0.15s;
}
.modal-btn:active { opacity: 0.7; }
.modal-btn.primary { background: var(--accent); color: #000; }
.modal-btn.secondary { background: var(--bg-card); color: var(--text-secondary); }

.modal-action {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.modal-action:last-child { border-bottom: none; }
.modal-action.danger { color: #ff453a; }
.modal-action:active { opacity: 0.6; }

/* ═══════════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════════ */
#empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--text-secondary);
  padding: 40px;
  text-align: center;
}
#empty-state.visible { display: flex; }
#empty-state .icon { font-size: 48px; opacity: 0.4; }
#empty-state p { font-size: 15px; line-height: 1.5; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">

  <!-- ── TOOLBAR ──────────────────────────────── -->
  <div id="toolbar">
    <div id="toolbar-left">
      <button class="toolbar-btn" id="menu-btn" aria-label="Menü">
        <!-- Hamburger SVG -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect y="3"  width="20" height="2" rx="1" fill="currentColor"/>
          <rect y="9"  width="20" height="2" rx="1" fill="currentColor"/>
          <rect y="15" width="20" height="2" rx="1" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div id="toolbar-center">
      <span id="note-title-display">Notizen</span>
      <span id="folder-badge"></span>
    </div>

    <div id="toolbar-right">
      <!-- Format buttons (erweiterbar) -->
      <button class="fmt-btn" id="fmt-bold"   title="Fett"        onclick="fmt('bold')"><b>B</b></button>
      <button class="fmt-btn" id="fmt-italic" title="Kursiv"      onclick="fmt('italic')"><i>I</i></button>
      <button class="fmt-btn" id="fmt-ul"     title="Aufzählung"  onclick="fmt('insertUnorderedList')">≡</button>
      <button class="fmt-btn" id="fmt-ol"     title="Nummerierung"onclick="fmt('insertOrderedList')">№</button>
      <!-- More format buttons can be added here -->
      <span id="save-indicator">✓ Gespeichert</span>
    </div>
  </div>

  <!-- ── EDITOR ────────────────────────────────── -->
  <div id="editor-area">
    <textarea id="note-title-input" placeholder="Titel" rows="1"></textarea>
    <div id="note-date-line"></div>
    <div id="editor" contenteditable="true" data-placeholder="Notiz …"></div>

    <div id="empty-state">
      <div class="icon">📝</div>
      <p>Öffne das Menü oben links,<br>um eine Notiz auszuwählen<br>oder eine neue zu erstellen.</p>
    </div>
  </div>

  <!-- ── OVERLAY ───────────────────────────────── -->
  <div id="overlay"></div>

  <!-- ── SIDE PANEL ───────────────────────────── -->
  <div id="side-panel">
    <div id="panel-header">
      <h2>Ordner</h2>
      <button id="panel-close">✕</button>
    </div>
    <div id="panel-body">

      <!-- Folder list view -->
      <div id="folders-view">
        <div id="folder-list"></div>
        <div id="add-folder-row" onclick="openNewFolderModal()">
          <span>＋</span><span>Neuer Ordner</span>
        </div>
      </div>

      <!-- Notes list view -->
      <div id="notes-view">
        <div id="notes-header">
          <button id="notes-back" onclick="showFolderView()">‹ Ordner</button>
          <span id="notes-folder-title"></span>
          <button id="new-note-btn" onclick="createNote()" title="Neue Notiz">＋</button>
        </div>
        <div id="note-list"></div>
      </div>

    </div>
  </div>

  <!-- ── MODAL SHEET ───────────────────────────── -->
  <div id="modal-backdrop" onclick="closeModal(event)">
    <div id="modal-sheet"><!-- filled dynamically --></div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════ */
let currentNoteId   = null;
let currentFolderId = null;
let folders         = [];
let saveTimer       = null;
let isDirty         = false;

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */
async function init() {
  await loadFolders();
  // Auto-open Quick Notes and load/create the first note
  const qn = folders.find(f => f.id === 'quick-notes');
  if (qn) {
    await selectFolder('quick-notes', false); // load notes list silently
    const notes = await fetchNotes('quick-notes');
    if (notes.length > 0) {
      await openNote(notes[0].id);
    } else {
      await createNote(false); // create silently without opening panel
    }
  }
}

/* ═══════════════════════════════════════════════
   API HELPERS
   ═══════════════════════════════════════════════ */
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  return r.json();
}

async function fetchNotes(folderId) {
  return api(`/folders/${folderId}/notes`);
}

/* ═══════════════════════════════════════════════
   FOLDERS
   ═══════════════════════════════════════════════ */
async function loadFolders() {
  folders = await api('/folders');
  renderFolderList();
}

function renderFolderList() {
  const list = document.getElementById('folder-list');
  list.innerHTML = '';
  folders.forEach(f => {
    const el = document.createElement('div');
    el.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
    el.innerHTML = `
      <span class="folder-icon">${f.icon}</span>
      <div class="folder-info">
        <div class="folder-name">${esc(f.name)}</div>
        <div class="folder-count">${f.note_count} Notiz${f.note_count !== 1 ? 'en' : ''}</div>
      </div>
      <span class="folder-chevron">›</span>`;
    el.onclick = () => selectFolder(f.id);
    list.appendChild(el);
  });
}

async function selectFolder(folderId, openPanel = true) {
  currentFolderId = folderId;
  renderFolderList();
  const folder = folders.find(f => f.id === folderId);
  document.getElementById('notes-folder-title').textContent = folder ? folder.name : '';
  // load notes
  const notes = await fetchNotes(folderId);
  renderNoteList(notes);
  showNotesView();
  if (openPanel) openSidePanel();
}

/* ═══════════════════════════════════════════════
   NOTES LIST
   ═══════════════════════════════════════════════ */
function renderNoteList(notes) {
  const list = document.getElementById('note-list');
  list.innerHTML = '';
  if (notes.length === 0) {
    list.innerHTML = '<div style="padding:20px 16px;color:var(--text-placeholder);font-size:13px;text-align:center">Noch keine Notizen</div>';
    return;
  }
  notes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'note-card' + (n.id === currentNoteId ? ' active' : '');
    el.innerHTML = `
      <div class="note-card-title">${esc(n.title) || 'Ohne Titel'}</div>
      <div class="note-card-preview">${esc(n.preview) || '—'}</div>
      <div class="note-card-date">${formatDate(n.updated)}</div>`;
    el.onclick = () => openNote(n.id);
    list.appendChild(el);
  });
}

/* ═══════════════════════════════════════════════
   OPEN / CREATE NOTE
   ═══════════════════════════════════════════════ */
async function openNote(noteId) {
  if (isDirty) await saveCurrentNote();
  const note = await api(`/notes/${noteId}`);
  currentNoteId = noteId;

  document.getElementById('note-title-input').value = note.title === 'New Note' ? '' : note.title;
  document.getElementById('editor').innerHTML = note.content || '';
  updateDateLine(note.updated);
  updateToolbarTitle(note.title, note.folder_id);

  // show editor, hide empty state
  setEditorVisible(true);

  closeSidePanel();
  document.getElementById('note-title-input').focus();

  // highlight active card
  document.querySelectorAll('.note-card').forEach(c => {
    c.classList.toggle('active', c.onclick && c.getAttribute('data-id') === noteId);
  });
  // refresh note list highlight
  if (currentFolderId) {
    const notes = await fetchNotes(currentFolderId);
    renderNoteList(notes);
  }
}

async function createNote(openPanel = true) {
  if (!currentFolderId) currentFolderId = 'quick-notes';
  if (isDirty) await saveCurrentNote();
  const note = await api(`/folders/${currentFolderId}/notes`, 'POST');
  currentNoteId = note.id;

  document.getElementById('note-title-input').value = '';
  document.getElementById('editor').innerHTML = '';
  updateDateLine(note.updated);
  updateToolbarTitle('Neue Notiz', currentFolderId);
  setEditorVisible(true);

  await loadFolders(); // refresh counts
  if (currentFolderId) {
    const notes = await fetchNotes(currentFolderId);
    renderNoteList(notes);
  }

  closeSidePanel();
  document.getElementById('note-title-input').focus();
}

/* ═══════════════════════════════════════════════
   SAVE
   ═══════════════════════════════════════════════ */
function scheduleSave() {
  isDirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentNote, parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--save-delay')) || 800);
}

async function saveCurrentNote() {
  if (!currentNoteId || !isDirty) return;
  isDirty = false;
  clearTimeout(saveTimer);
  const title = document.getElementById('note-title-input').value.trim() || 'Ohne Titel';
  const content = document.getElementById('editor').innerHTML;
  const note = await api(`/notes/${currentNoteId}`, 'PUT', { title, content });
  updateToolbarTitle(note.title, note.folder_id);
  updateDateLine(note.updated);
  showSaveIndicator();
  // refresh sidebar if visible
  if (currentFolderId) {
    const notes = await fetchNotes(currentFolderId);
    renderNoteList(notes);
    await loadFolders();
  }
}

function showSaveIndicator() {
  const el = document.getElementById('save-indicator');
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 2000);
}

/* ═══════════════════════════════════════════════
   FORMAT COMMANDS
   (hier neue Formatierungen ergänzen)
   ═══════════════════════════════════════════════ */
function fmt(cmd, value = null) {
  document.getElementById('editor').focus();
  document.execCommand(cmd, false, value);
  updateFmtButtons();
  scheduleSave();
}

function updateFmtButtons() {
  document.getElementById('fmt-bold').classList.toggle('active',   document.queryCommandState('bold'));
  document.getElementById('fmt-italic').classList.toggle('active', document.queryCommandState('italic'));
  document.getElementById('fmt-ul').classList.toggle('active',     document.queryCommandState('insertUnorderedList'));
  document.getElementById('fmt-ol').classList.toggle('active',     document.queryCommandState('insertOrderedList'));
}

/* ═══════════════════════════════════════════════
   SIDE PANEL
   ═══════════════════════════════════════════════ */
function openSidePanel() {
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('overlay').style.display = 'block';
  requestAnimationFrame(() => document.getElementById('overlay').classList.add('visible'));
}

function closeSidePanel() {
  document.getElementById('side-panel').classList.remove('open');
  const ov = document.getElementById('overlay');
  ov.classList.remove('visible');
  setTimeout(() => { ov.style.display = 'none'; }, 250);
}

function showFolderView() {
  document.getElementById('folders-view').classList.remove('hidden');
  document.getElementById('notes-view').classList.remove('visible');
}

function showNotesView() {
  document.getElementById('folders-view').classList.add('hidden');
  document.getElementById('notes-view').classList.add('visible');
}

/* ═══════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════ */
function openNewFolderModal() {
  const sheet = document.getElementById('modal-sheet');
  sheet.innerHTML = `
    <div class="modal-title">Neuer Ordner</div>
    <input class="modal-input" id="new-folder-name" placeholder="Ordnername" type="text" autocomplete="off">
    <div class="modal-btn-row">
      <button class="modal-btn secondary" onclick="closeModal()">Abbrechen</button>
      <button class="modal-btn primary"   onclick="submitNewFolder()">Erstellen</button>
    </div>`;
  document.getElementById('modal-backdrop').classList.add('visible');
  setTimeout(() => document.getElementById('new-folder-name').focus(), 100);
}

async function submitNewFolder() {
  const name = document.getElementById('new-folder-name').value.trim();
  if (!name) return;
  await api('/folders', 'POST', { name, icon: '📁' });
  await loadFolders();
  closeModal();
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-backdrop')) return;
  document.getElementById('modal-backdrop').classList.remove('visible');
}

/* ═══════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════ */
function setEditorVisible(visible) {
  document.getElementById('note-title-input').style.display = visible ? '' : 'none';
  document.getElementById('note-date-line').style.display  = visible ? '' : 'none';
  document.getElementById('editor').style.display          = visible ? '' : 'none';
  document.getElementById('empty-state').classList.toggle('visible', !visible);
}

function updateToolbarTitle(title, folderId) {
  document.getElementById('note-title-display').textContent = title || 'Neue Notiz';
  const folder = folders.find(f => f.id === folderId);
  document.getElementById('folder-badge').textContent = folder ? folder.name : '';
}

function updateDateLine(iso) {
  const d = new Date(iso + 'Z');
  document.getElementById('note-date-line').textContent = d.toLocaleString('de-DE', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}

function formatDate(iso) {
  const d = new Date(iso + 'Z');
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60)   return 'Gerade eben';
  if (diff < 3600) return `Vor ${Math.floor(diff/60)} Min.`;
  if (diff < 86400 && d.getDate() === now.getDate()) return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══════════════════════════════════════════════
   EVENT LISTENERS
   ═══════════════════════════════════════════════ */
document.getElementById('menu-btn').addEventListener('click', () => {
  saveCurrentNote();
  showFolderView();
  openSidePanel();
});

document.getElementById('panel-close').addEventListener('click', closeSidePanel);
document.getElementById('overlay').addEventListener('click', closeSidePanel);

document.getElementById('note-title-input').addEventListener('input', function () {
  // auto-resize
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
  scheduleSave();
});

document.getElementById('editor').addEventListener('input', () => {
  scheduleSave();
  updateFmtButtons();
});

document.getElementById('editor').addEventListener('keyup', updateFmtButtons);
document.getElementById('editor').addEventListener('mouseup', updateFmtButtons);
document.getElementById('editor').addEventListener('selectionchange', updateFmtButtons);

// save on visibility change (phone locks / switches app)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveCurrentNote();
});

// prevent accidental navigation
window.addEventListener('beforeunload', () => {
  if (isDirty) saveCurrentNote();
});

/* ═══════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════ */
setEditorVisible(false);
init();
</script>
</body>
</html>
