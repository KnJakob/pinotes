<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notizen</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <!-- ── TOOLBAR ──────────────────────────────── -->
  <div id="toolbar">
    <div id="toolbar-left">
      <button class="toolbar-btn" id="menu-btn" aria-label="Menü">
        <!-- Hamburger SVG -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect y="3"  width="20" height="2" rx="1" fill="currentColor"/>
          <rect y="9"  width="20" height="2" rx="1" fill="currentColor"/>
          <rect y="15" width="20" height="2" rx="1" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div id="toolbar-center">
      <span id="note-title-display">Notizen</span>
      <span id="folder-badge"></span>
    </div>

    <div id="toolbar-right">
      <!-- Format buttons (erweiterbar) -->
      <button class="fmt-btn" id="fmt-bold"   title="Fett"        onclick="fmt('bold')"><b>B</b></button>
      <button class="fmt-btn" id="fmt-italic" title="Kursiv"      onclick="fmt('italic')"><i>I</i></button>
      <button class="fmt-btn" id="fmt-ul"     title="Aufzählung"  onclick="fmt('insertUnorderedList')">≡</button>
      <button class="fmt-btn" id="fmt-ol"     title="Nummerierung"onclick="fmt('insertOrderedList')">№</button>
	  <button class="fmt-btn" id="fmt-h1"     title="Überschrift" onclick="fmt('formatBlock', 'H1')">H1</button>
	  <button class="fmt-btn" id="fmt-h2"     title="Überschrift" onclick="fmt('formatBlock', 'H2')">H2</button>
	  <button class="fmt-btn" id="fmt-h3"     title="Überschrift" onclick="fmt('formatBlock', 'H3')">H3</button>

      <span id="save-indicator">✓ Gespeichert</span>
    </div>
  </div>

  <!-- ── EDITOR ────────────────────────────────── -->
  <div id="editor-area">
    <textarea id="note-title-input" placeholder="Titel" rows="1"></textarea>
    <div id="note-date-line"></div>
    <div id="editor" contenteditable="true" data-placeholder="Notiz …" spellcheck="true" lang="de"></div>

    <div id="empty-state">
      <div class="icon">📝</div>
      <p>Öffne das Menü oben links,<br>um eine Notiz auszuwählen<br>oder eine neue zu erstellen.</p>
    </div>
  </div>

  <!-- ── OVERLAY ───────────────────────────────── -->
  <div id="overlay"></div>

  <!-- ── SIDE PANEL ───────────────────────────── -->
  <div id="side-panel">
    <div id="panel-header">
      <h2>Ordner</h2>
      <button id="panel-close">✕</button>
    </div>
    <div id="panel-body">

      <!-- Folder list view -->
      <div id="folders-view">
        <div id="folder-list"></div>
        <div id="add-folder-row" onclick="openNewFolderModal()">
          <span>＋</span><span>Neuer Ordner</span>
        </div>
      </div>

      <!-- Notes list view -->
      <div id="notes-view">
        <div id="notes-header">
          <button id="notes-back" onclick="showFolderView()">‹ Ordner</button>
          <span id="notes-folder-title"></span>
          <button id="new-note-btn" onclick="createNote()" title="Neue Notiz">＋</button>
        </div>
        <div id="note-list"></div>
      </div>

    </div>
  </div>

  <!-- ── MODAL SHEET ───────────────────────────── -->
  <div id="modal-backdrop" onclick="closeModal(event)">
    <div id="modal-sheet"><!-- filled dynamically --></div>
  </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
